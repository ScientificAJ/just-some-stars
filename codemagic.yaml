workflows:
  android-internal:
    name: Just Some Stars - Android Internal
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      unity: 6000.3.22f1
      groups:
        - jss_unity_ci
      vars:
        JSS_UNITY_VERSION: "6000.3.22f1"
        JSS_UNITY_REVISION: "1c726e1fb402"
    scripts:
      - name: Hydrate and verify every tracked Git LFS object
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          command -v git-lfs >/dev/null 2>&1 || {
            printf 'git-lfs is required before Unity activation.\n' >&2
            exit 1
          }
          unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_CURL GIT_CURL_VERBOSE
          unset GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF
          export GIT_TERMINAL_PROMPT=0
          git lfs version
          git lfs install --local --skip-smudge --skip-repo
          git lfs pull --include="" --exclude=""
          git lfs checkout

          JSS_LFS_MANIFEST="$(mktemp "${TMPDIR:-/tmp}/jss-lfs-files.XXXXXX")"
          jss_remove_lfs_manifest() {
            rm -f "$JSS_LFS_MANIFEST"
          }
          trap jss_remove_lfs_manifest EXIT
          git lfs ls-files --json > "$JSS_LFS_MANIFEST"
          python3 - "$CM_BUILD_DIR" "$JSS_LFS_MANIFEST" <<'PY'
          import hashlib
          import json
          import re
          import struct
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          manifest_path = Path(sys.argv[2])
          with manifest_path.open(encoding="utf-8") as stream:
              manifest = json.load(stream)
          if not isinstance(manifest, dict):
              raise SystemExit("Git LFS emitted a non-object JSON manifest")
          entries = manifest.get("files")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("the checkout enumerated no tracked Git LFS paths")

          verified_paths = set()
          for entry in entries:
              if not isinstance(entry, dict):
                  raise SystemExit("Git LFS emitted a malformed file entry")
              relative_name = entry.get("name")
              if not isinstance(relative_name, str) or not relative_name:
                  raise SystemExit("Git LFS emitted an entry without a valid path")
              if Path(relative_name).is_absolute():
                  raise SystemExit(f"Git LFS emitted an absolute path: {relative_name}")
              if relative_name in verified_paths:
                  raise SystemExit(f"Git LFS emitted a duplicate path: {relative_name}")
              worktree_path = root / relative_name
              if worktree_path.is_symlink():
                  raise SystemExit(f"tracked LFS path is a symlink: {relative_name}")
              try:
                  resolved_path = worktree_path.resolve(strict=True)
                  resolved_path.relative_to(root)
              except (FileNotFoundError, ValueError) as error:
                  raise SystemExit(
                      f"tracked LFS path is missing or escapes the checkout: {relative_name}"
                  ) from error
              if not resolved_path.is_file():
                  raise SystemExit(f"tracked LFS path is not a file: {relative_name}")
              if entry.get("oid_type") != "sha256":
                  raise SystemExit(f"tracked LFS path has a non-SHA256 OID: {relative_name}")
              expected_oid = entry.get("oid")
              if not isinstance(expected_oid, str) or re.fullmatch(
                  r"[0-9a-f]{64}", expected_oid
              ) is None:
                  raise SystemExit(f"tracked LFS path has an invalid OID: {relative_name}")
              expected_size = entry.get("size")
              if not isinstance(expected_size, int) or expected_size < 0:
                  raise SystemExit(f"tracked LFS path has an invalid size: {relative_name}")
              if entry.get("checkout") is not True or entry.get("downloaded") is not True:
                  raise SystemExit(f"tracked LFS object is not hydrated: {relative_name}")

              pointer_check = subprocess.run(
                  [
                      "git",
                      "lfs",
                      "pointer",
                      "--check",
                      f"--file={resolved_path}",
                  ],
                  cwd=root,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if pointer_check.returncode == 0:
                  raise SystemExit(
                      f"tracked LFS worktree file is still a pointer: {relative_name}"
                  )
              if pointer_check.returncode != 1:
                  raise SystemExit(
                      f"could not inspect tracked LFS worktree file: {relative_name}"
                  )

              digest = hashlib.sha256()
              actual_size = 0
              with resolved_path.open("rb") as stream:
                  while chunk := stream.read(1024 * 1024):
                      actual_size += len(chunk)
                      digest.update(chunk)
              if actual_size != expected_size:
                  raise SystemExit(
                      f"tracked LFS size mismatch for {relative_name}: "
                      f"expected {expected_size}, got {actual_size}"
                  )
              actual_oid = digest.hexdigest()
              if actual_oid != expected_oid:
                  raise SystemExit(
                      f"tracked LFS OID mismatch for {relative_name}: "
                      f"expected {expected_oid}, got {actual_oid}"
                  )
              verified_paths.add(relative_name)
              print(f"Verified hydrated Git LFS object: {relative_name}")

          emoji_relative = "Assets/TextMesh Pro/Sprites/EmojiOne.png"
          if emoji_relative not in verified_paths:
              raise SystemExit(f"required retained LFS path is not tracked: {emoji_relative}")
          emoji_path = root / emoji_relative
          with emoji_path.open("rb") as stream:
              png_header = stream.read(24)
          png_signature = b"\x89PNG\r\n\x1a\n"
          if (
              len(png_header) != 24
              or png_header[:8] != png_signature
              or png_header[8:12] != b"\x00\x00\x00\r"
              or png_header[12:16] != b"IHDR"
          ):
              raise SystemExit("retained EmojiOne.png does not have a real PNG/IHDR signature")
          width, height = struct.unpack(">II", png_header[16:24])
          if width == 0 or height == 0:
              raise SystemExit("retained EmojiOne.png has invalid PNG dimensions")
          print(f"Verified retained EmojiOne.png PNG signature: {width}x{height}")
          PY
          jss_remove_lfs_manifest
          trap - EXIT

      - name: Activate Unity Plus or Pro license
        script: |
          set -euo pipefail
          set +x
          : "${UNITY_HOME:?Codemagic did not provision the requested Unity editor}"
          : "${UNITY_SERIAL:?Configure encrypted UNITY_SERIAL in jss_unity_ci}"
          : "${UNITY_EMAIL:?Configure encrypted UNITY_EMAIL in jss_unity_ci}"
          : "${UNITY_PASSWORD:?Configure encrypted UNITY_PASSWORD in jss_unity_ci}"
          JSS_UNITY_EDITOR="$UNITY_HOME/Contents/MacOS/Unity"
          test -x "$JSS_UNITY_EDITOR"
          "$JSS_UNITY_EDITOR" \
            -batchmode -nographics -quit -logFile /dev/null \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"

      - name: Verify clean checkout and exact provisioned toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p Builds/TestResults Builds/Logs
          JSS_EXPECTED_UNITY_HOME="/Applications/Unity/Hub/Editor/${JSS_UNITY_VERSION}/Unity.app"
          JSS_UNITY_EDITOR="$UNITY_HOME/Contents/MacOS/Unity"
          JSS_ANDROID_PLAYER="$UNITY_HOME/Contents/PlaybackEngines/AndroidPlayer"
          test "$UNITY_HOME" = "$JSS_EXPECTED_UNITY_HOME"
          test -x "$JSS_UNITY_EDITOR"
          test -d "$JSS_ANDROID_PLAYER"
          test -x "$JSS_ANDROID_PLAYER/OpenJDK/bin/java"
          test -d "$JSS_ANDROID_PLAYER/SDK"
          test -d "$JSS_ANDROID_PLAYER/NDK"
          JSS_APKANALYZER="$JSS_ANDROID_PLAYER/SDK/cmdline-tools/16.0/bin/apkanalyzer"
          JSS_AAPT="$JSS_ANDROID_PLAYER/SDK/build-tools/36.0.0/aapt"
          test -x "$JSS_APKANALYZER"
          test -x "$JSS_AAPT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          grep -Fx "m_EditorVersion: ${JSS_UNITY_VERSION}" \
            ProjectSettings/ProjectVersion.txt
          grep -Fx \
            "m_EditorVersionWithRevision: ${JSS_UNITY_VERSION} (${JSS_UNITY_REVISION})" \
            ProjectSettings/ProjectVersion.txt
          JSS_EDITOR_PROBE_LOG="$(mktemp "${TMPDIR:-/tmp}/jss-unity-editor-probe.XXXXXX")"
          jss_remove_editor_probe_log() {
            rm -f "$JSS_EDITOR_PROBE_LOG"
          }
          trap jss_remove_editor_probe_log EXIT
          "$JSS_UNITY_EDITOR" \
            -batchmode -nographics -quit \
            -projectPath "$CM_BUILD_DIR" \
            -logFile "$JSS_EDITOR_PROBE_LOG"
          grep -F "${JSS_UNITY_VERSION} (${JSS_UNITY_REVISION})" \
            "$JSS_EDITOR_PROBE_LOG"
          jss_remove_editor_probe_log
          trap - EXIT
          printf 'JSS_UNITY_EDITOR=%s\n' "$JSS_UNITY_EDITOR" >> "$CM_ENV"
          printf 'JSS_APKANALYZER=%s\n' "$JSS_APKANALYZER" >> "$CM_ENV"
          printf 'JSS_AAPT=%s\n' "$JSS_AAPT" >> "$CM_ENV"

      - name: Run project-owned EditMode tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          "$JSS_UNITY_EDITOR" \
            -batchmode -nographics -buildTarget Android \
            -projectPath "$CM_BUILD_DIR" \
            -runTests -testPlatform editmode \
            -assemblyNames JustSomeStars.EditModeTests \
            -testResults "$CM_BUILD_DIR/Builds/TestResults/codemagic-editmode.xml" \
            -logFile "$CM_BUILD_DIR/Builds/Logs/codemagic-editmode.log"
          python3 - "$CM_BUILD_DIR/Builds/TestResults/codemagic-editmode.xml" 211 <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(sys.argv[1])
          expected = int(sys.argv[2])
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit(f"missing or empty Unity test report: {report}")
          root = ET.parse(report).getroot()
          if root.tag.rsplit("}", 1)[-1] != "test-run":
              raise SystemExit(f"unexpected Unity test-report root: {root.tag}")

          def required_count(name):
              value = root.attrib.get(name)
              if value is None:
                  raise SystemExit(f"Unity test report has no {name!r} count")
              try:
                  return int(value)
              except ValueError as error:
                  raise SystemExit(
                      f"Unity test report has invalid {name!r} count: {value!r}"
                  ) from error

          result = root.attrib.get("result")
          testcasecount = required_count("testcasecount")
          total = required_count("total")
          passed = required_count("passed")
          failed = required_count("failed")
          skipped = required_count("skipped")
          inconclusive = required_count("inconclusive")
          cases = sum(
              1
              for element in root.iter()
              if element.tag.rsplit("}", 1)[-1] == "test-case"
          )
          if result != "Passed":
              raise SystemExit(f"Unity test result was {result!r}, not 'Passed'")
          if (failed, skipped, inconclusive) != (0, 0, 0):
              raise SystemExit(
                  "Unity test report is not clean: "
                  f"failed={failed}, skipped={skipped}, "
                  f"inconclusive={inconclusive}"
              )
          if (testcasecount, total, passed, cases) != (expected,) * 4:
              raise SystemExit(
                  "Unity selected-test count mismatch: "
                  f"expected={expected}, testcasecount={testcasecount}, "
                  f"total={total}, passed={passed}, test-case-elements={cases}"
              )
          print(f"Verified {expected} passing EditMode tests with no omissions.")
          PY
        test_report: Builds/TestResults/codemagic-editmode.xml

      - name: Run Task 5 launch PlayMode smoke
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          "$JSS_UNITY_EDITOR" \
            -batchmode -nographics -buildTarget Android \
            -projectPath "$CM_BUILD_DIR" \
            -runTests -testPlatform playmode \
            -assemblyNames JustSomeStars.PlayModeTests \
            -testFilter JustSomeStars.Tests.PlayMode.Task5LaunchIntegrationTests \
            -testResults "$CM_BUILD_DIR/Builds/TestResults/codemagic-task5-playmode.xml" \
            -logFile "$CM_BUILD_DIR/Builds/Logs/codemagic-task5-playmode.log"
          python3 - "$CM_BUILD_DIR/Builds/TestResults/codemagic-task5-playmode.xml" 1 <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(sys.argv[1])
